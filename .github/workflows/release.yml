name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Build and publish the release
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Check that the tag matches the version
        id: version
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ("v$version" -cne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME doesn't match version $version in Directory.Build.props." }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        run: .\build.ps1 | Tee-Object build.log

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/installer/*.exe

      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $setup = Get-Item artifacts\installer\*.exe
          $tests = [regex]::Match((Get-Content build.log -Raw), 'Failed:\s*0,\s*Passed:\s*(\d+)').Groups[1].Value
          if (-not $tests) { throw "The build log has no passing test summary." }
          $changes = [regex]::Match((Get-Content CHANGELOG.md -Raw -Encoding utf8), "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:|\z)").Groups[1].Value.Trim()
          if (-not $changes) { throw "CHANGELOG.md has no section for $env:VERSION." }
          # Release notes keep line breaks, so join the wrapped lines of each list item.
          $changes = $changes -replace '\r?\n {2,}(?=\S)', ' '
          $values = @{
            FILE = $setup.Name
            SHA256 = (Get-FileHash $setup -Algorithm SHA256).Hash
            TESTS = $tests
            CHANGES = $changes
            TAG = $env:GITHUB_REF_NAME
            SERVER = $env:GITHUB_SERVER_URL
            REPOSITORY = $env:GITHUB_REPOSITORY
            RUN_URL = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          }
          $notes = Get-Content .github\release-notes.md -Raw -Encoding utf8
          foreach ($key in $values.Keys) { $notes = $notes.Replace("{{$key}}", $values[$key]) }
          Set-Content release-notes.md $notes -Encoding utf8
          Get-Content release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create $env:GITHUB_REF_NAME (Get-Item artifacts\installer\*.exe).FullName --title "PermaDel $env:VERSION" --notes-file release-notes.md --verify-tag
