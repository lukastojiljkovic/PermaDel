name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What would you like PermaDel to do, and when do you run into it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your idea
      description: How should it work? If it changes what gets shredded or refused, describe the safety checks it needs.
    validations:
      required: true
